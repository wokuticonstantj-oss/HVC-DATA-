<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HVC — Harembe Viewer's Corporation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#16332B;
    --ink-soft:#2A4A3D;
    --paper:#F6F4EA;
    --paper-card:#FFFFFF;
    --gold:#B8892E;
    --gold-soft:#EFE0BE;
    --rust:#8B5E34;
    --danger:#B3452C;
    --success:#3F7D5C;
    --line:#E1DCC9;
    --text:#1C2B22;
    --text-muted:#5B6B60;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',sans-serif;}
  .display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  #root{min-height:100vh;}
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--ink);color:#F0EBD8;flex-shrink:0;display:flex;flex-direction:column;padding:24px 0;}
  .brand{padding:0 20px 20px;border-bottom:1px solid rgba(240,235,216,0.15);margin-bottom:12px;}
  .brand-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;letter-spacing:0.01em;line-height:1.2;}
  .brand-sub{font-size:11px;color:#B7C4BA;margin-top:4px;letter-spacing:0.04em;text-transform:uppercase;}
  .nav-item{padding:12px 20px;font-size:14px;font-weight:500;cursor:pointer;color:#CFE0D3;border-left:3px solid transparent;transition:background .15s;}
  .nav-item:hover{background:rgba(255,255,255,0.06);}
  .nav-item.active{background:rgba(255,255,255,0.09);border-left-color:var(--gold);color:#fff;}
  .main{flex:1;padding:28px 32px;max-width:1100px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .page-title{font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin:0;}
  .who{font-size:13px;color:var(--text-muted);}
  .who select{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;}
  .card{background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
  .stat-label{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:6px;}
  .stat-value{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--ink);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);border-bottom:1px solid var(--line);padding:8px 10px;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .amount{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .amount.pos{color:var(--success);}
  .amount.neg{color:var(--danger);}
  .stamp{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.06em;padding:3px 8px;border-radius:3px;border:1.5px solid currentColor;transform:rotate(-3deg);text-transform:uppercase;}
  .stamp.Verified{color:var(--success);}
  .stamp.Pending{color:var(--gold);}
  .stamp.Disputed{color:var(--danger);}
  .stamp.New{color:var(--rust);}
  .stamp.Planned{color:var(--gold);}
  .stamp.Done{color:var(--success);}
  .stamp.Rejected{color:var(--danger);}
  .btn{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:7px;border:none;cursor:pointer;background:var(--ink);color:#fff;}
  .btn:hover{background:var(--ink-soft);}
  .btn.gold{background:var(--gold);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  input,select,textarea{font-family:'Inter',sans-serif;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff;color:var(--text);}
  label{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:4px;display:block;}
  .field{margin-bottom:12px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .section-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 12px;}
  .owner-lock{background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:14px;margin-bottom:16px;font-size:13px;}
  .badge-role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:2px 7px;border-radius:4px;background:var(--gold-soft);color:var(--rust);}
  .empty{color:var(--text-muted);font-size:13px;padding:16px 0;text-align:center;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50;}
  .toast.error{background:var(--danger);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

// =========================================================================
// CONFIGURE THIS: your deployed Apps Script Web App URL (ends in /exec)
// =========================================================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbxeBkVesEqqiWbysuit8OQxXkPV7ifUAaUMTRXRoi8oix_EMDhLmWae3IRcpZxcGNM_Zg/exec";

function fmtUgx(n) {
  const v = Number(n) || 0;
  return "UGX " + v.toLocaleString("en-UG");
}

async function callApi(payload) {
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight against Apps Script
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function fetchAll(session, ownerPassword) {
  return callApi({ action: "getAll", sessionToken: session ? session.token : "", ownerPassword: ownerPassword || "" });
}

function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((message, isError) => {
    setToast({ message, isError });
    setTimeout(() => setToast(null), 3500);
  }, []);
  return [toast, show];
}

function loadSession() {
  try { return JSON.parse(localStorage.getItem("hvc_session") || "null"); } catch (e) { return null; }
}

function App() {
  const [data, setData] = useState(null);
  const [view, setView] = useState("overview");
  const [session, setSession] = useState(loadSession);
  const [ownerPassword, setOwnerPassword] = useState(() => sessionStorage.getItem("hvc_owner_pw") || "");
  const [toast, showToast] = useToast();
  const [loading, setLoading] = useState(true);

  const refresh = useCallback(() => {
    if (!session && !ownerPassword) { setLoading(false); return; }
    fetchAll(session, ownerPassword)
      .then(d => { setData(d); setLoading(false); })
      .catch(e => {
        setLoading(false);
        if (/log in|session/i.test(String(e.message))) { setSession(null); localStorage.removeItem("hvc_session"); }
        showToast(String(e.message || e), true);
      });
  }, [session, ownerPassword, showToast]);

  useEffect(() => { refresh(); const t = setInterval(refresh, 30000); return () => clearInterval(t); }, [refresh]);
  useEffect(() => { sessionStorage.setItem("hvc_owner_pw", ownerPassword); }, [ownerPassword]);
  useEffect(() => { localStorage.setItem("hvc_session", session ? JSON.stringify(session) : ""); }, [session]);

  const isOwner = !!ownerPassword; // verified server-side on every owner action, this just tracks "entered"

  const doAction = async (payload) => {
    try {
      const res = await callApi(Object.assign({ sessionToken: session ? session.token : "" }, payload));
      refresh();
      showToast("Saved.");
      return res;
    } catch (e) {
      showToast(String(e.message || e), true);
      throw e;
    }
  };

  const logout = () => { setSession(null); setData(null); localStorage.removeItem("hvc_session"); };

  if (!session) {
    return <Login onLoggedIn={(s) => { setSession(s); }} showToast={showToast} toast={toast} />;
  }

  if (loading) return <div className="main"><p>Loading HVC dashboard…</p></div>;
  if (!data) return <div className="main"><p>Could not reach the backend. Check GAS_URL at the top of the script.</p></div>;

  const me = session.memberId;

  const nav = [
    ["overview", "Overview"],
    ["members", "Members & Equity"],
    ["ledger", "Financial Ledger"],
    ["batches", "Poultry Batches"],
    ["reports", "Reports"],
    ["ideas", "Ideas"],
    ["settings", "Settings"]
  ];

  return (
    <div className="app-shell">
      <div className="sidebar">
        <div className="brand">
          <div className="brand-title">HVC</div>
          <div className="brand-sub">Harembe Viewer's Corp.</div>
        </div>
        {nav.map(([key, label]) => (
          <div key={key} className={"nav-item" + (view === key ? " active" : "")} onClick={() => setView(key)}>{label}</div>
        ))}
      </div>
      <div className="main">
        <div className="topbar">
          <h1 className="page-title">{nav.find(n => n[0] === view)[1]}</h1>
          <div className="who">
            Signed in as <b>{session.fullName}</b> ({session.role}){" "}
            <button className="btn ghost" onClick={logout}>Log out</button>
          </div>
        </div>

        {view === "overview" && <Overview data={data} />}
        {view === "members" && <Members data={data} isOwner={isOwner} ownerPassword={ownerPassword} doAction={doAction} />}
        {view === "ledger" && <Ledger data={data} me={me} isOwner={isOwner} ownerPassword={ownerPassword} doAction={doAction} />}
        {view === "batches" && <Batches data={data} me={me} isOwner={isOwner} ownerPassword={ownerPassword} doAction={doAction} />}
        {view === "reports" && <Reports data={data} />}
        {view === "ideas" && <Ideas data={data} me={me} isOwner={isOwner} ownerPassword={ownerPassword} doAction={doAction} />}
        {view === "settings" && <Settings data={data} session={session} isOwner={isOwner} ownerPassword={ownerPassword} setOwnerPassword={setOwnerPassword} doAction={doAction} />}

        {toast && <div className={"toast" + (toast.isError ? " error" : "")}>{toast.message}</div>}
      </div>
    </div>
  );
}

function Login({ onLoggedIn, showToast, toast }) {
  const [memberId, setMemberId] = useState("");
  const [fullName, setFullName] = useState("");
  const [pin, setPin] = useState("");
  const [members, setMembers] = useState(null);
  const [loadingMembers, setLoadingMembers] = useState(false);

  // The member picker needs names, but names are only available via a
  // logged-in session — so we bootstrap it from whatever the person types,
  // matched by name, rather than exposing an open member list.
  // Simplify: ask for name text; backend matches on member_id normally,
  // so we resolve name -> member_id via a lightweight lookup action.
  const [step, setStep] = useState("name"); // name -> pin

  const findMember = async () => {
    try {
      const res = await callApi({ action: "resolveMemberByName", fullName });
      setMemberId(res.memberId);
      setStep("pin");
    } catch (e) {
      showToast(String(e.message || e), true);
    }
  };

  const submitPin = async () => {
    try {
      const res = await callApi({ action: "login", memberId, pin });
      onLoggedIn({ token: res.token, memberId: res.memberId, fullName: res.fullName, role: res.role });
    } catch (e) {
      showToast(String(e.message || e), true);
    }
  };

  return (
    <div style={{maxWidth:360,margin:"60px auto",padding:"0 20px"}}>
      <div className="brand-title" style={{color:"var(--ink)",fontSize:28,marginBottom:4}}>HVC</div>
      <div style={{color:"var(--text-muted)",fontSize:13,marginBottom:24}}>Harembe Viewer's Corporation — sign in</div>
      <div className="card">
        {step === "name" && (
          <div>
            <div className="field"><label>Your full name (as registered)</label><input value={fullName} onChange={e => setFullName(e.target.value)} placeholder="e.g. Wokuti Constant" /></div>
            <button className="btn gold" disabled={!fullName} onClick={findMember}>Continue</button>
          </div>
        )}
        {step === "pin" && (
          <div>
            <div className="field"><label>PIN</label><input type="password" inputMode="numeric" value={pin} onChange={e => setPin(e.target.value)} /></div>
            <button className="btn gold" disabled={!pin} onClick={submitPin}>Sign in</button>{" "}
            <button className="btn ghost" onClick={() => setStep("name")}>Back</button>
          </div>
        )}
      </div>
      <p style={{fontSize:12,color:"var(--text-muted)",marginTop:14}}>Forgot your PIN? Ask the Chairman to reset it from Settings.</p>
      {toast && <div className={"toast" + (toast.isError ? " error" : "")}>{toast.message}</div>}
    </div>
  );
}

function Overview({ data }) {
  const totalCapital = (data.members || []).filter(m => m.status === "Active").reduce((s, m) => s + Number(m.share_capital_ugx || 0), 0);
  const ledger = data.ledger || [];
  const sumBy = (cat) => ledger.filter(l => l.category === cat).reduce((s, l) => s + Number(l.amount_ugx || 0), 0);
  const revenue = sumBy("Revenue");
  const expenditure = sumBy("Expenditure") + sumBy("AssetLoss");
  const activeBirds = (data.batches || []).filter(b => b.status === "Active").reduce((s, b) => s + Number(b.current_active_quantity || 0), 0);
  const pendingCount = ledger.filter(l => l.verification_state === "Pending").length;

  return (
    <div>
      <div className="grid">
        <div className="card"><div className="stat-label">Total Share Capital</div><div className="stat-value mono">{fmtUgx(totalCapital)}</div></div>
        <div className="card"><div className="stat-label">Revenue Recorded</div><div className="stat-value mono">{fmtUgx(revenue)}</div></div>
        <div className="card"><div className="stat-label">Expenditure &amp; Losses</div><div className="stat-value mono">{fmtUgx(expenditure)}</div></div>
        <div className="card"><div className="stat-label">Active Birds</div><div className="stat-value mono">{activeBirds}</div></div>
      </div>
      <div className="card">
        <div className="section-title">Recent Ledger Activity</div>
        <table>
          <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody>
            {ledger.slice(-8).reverse().map(l => (
              <tr key={l.transaction_id}>
                <td>{new Date(l.timestamp).toLocaleDateString()}</td>
                <td>{l.category}</td>
                <td>{l.description}</td>
                <td className={"amount " + (["Revenue"].includes(l.category) ? "pos" : "neg")}>{fmtUgx(l.amount_ugx)}</td>
                <td><span className={"stamp " + l.verification_state}>{l.verification_state}</span></td>
              </tr>
            ))}
            {ledger.length === 0 && <tr><td colSpan="5" className="empty">No transactions yet.</td></tr>}
          </tbody>
        </table>
        {pendingCount > 0 && <p style={{fontSize:12,color:"var(--text-muted)",marginTop:10}}>{pendingCount} transaction(s) awaiting owner verification.</p>}
      </div>
    </div>
  );
}

function OwnerGate({ ownerPassword, isOwner, children }) {
  if (isOwner) return children;
  return <div className="owner-lock">Owner password required to view/edit this section. Enter it in <b>Settings</b>.</div>;
}

function Members({ data, isOwner, ownerPassword, doAction }) {
  const [form, setForm] = useState({ fullName: "", role: "Member", shareCapitalUgx: "", pin: "" });
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [lastIssuedPin, setLastIssuedPin] = useState(null);
  const roles = (data.config.Roles || "").split(",");
  const statuses = ["Active", "Suspended", "Archived"];

  const submit = async () => {
    const res = await doAction({ action: "addMember", ownerPassword, ownerName: "Owner", fullName: form.fullName, role: form.role, shareCapitalUgx: Number(form.shareCapitalUgx), pin: form.pin || undefined });
    if (res && res.initialPin) setLastIssuedPin({ name: form.fullName, pin: res.initialPin });
    setForm({ fullName: "", role: "Member", shareCapitalUgx: "", pin: "" });
  };

  const resetPin = async (m) => {
    const res = await doAction({ action: "resetMemberPin", ownerPassword, ownerName: "Owner", memberId: m.member_id });
    if (res && res.newPin) setLastIssuedPin({ name: m.full_name, pin: res.newPin });
  };

  const startEdit = (m) => {
    setEditingId(m.member_id);
    setEditForm({ full_name: m.full_name, role: m.role, share_capital_ugx: m.share_capital_ugx, status: m.status });
  };

  const saveEdit = async (memberId) => {
    await doAction({
      action: "updateMember",
      ownerPassword,
      ownerName: "Owner",
      memberId,
      fields: {
        full_name: editForm.full_name,
        role: editForm.role,
        share_capital_ugx: Number(editForm.share_capital_ugx),
        status: editForm.status
      },
      reason: "Corrected via Members edit"
    });
    setEditingId(null);
  };

  return (
    <div>
      <div className="card">
        <div className="section-title">Members</div>
        {isOwner && <p style={{fontSize:12,color:"var(--text-muted)",marginTop:-6,marginBottom:14}}>
          Made a mistake entering someone? Tap Edit to correct name, role, capital, or set status to Archived to remove a duplicate from equity calculations without deleting its history.
        </p>}
        <table>
          <thead><tr><th>Name</th><th>Role</th><th>Capital</th><th>Equity</th><th>Status</th>{isOwner && <th></th>}</tr></thead>
          <tbody>
            {(data.members || []).map(m => (
              editingId === m.member_id ? (
                <tr key={m.member_id}>
                  <td><input value={editForm.full_name} onChange={e => setEditForm({...editForm, full_name: e.target.value})} /></td>
                  <td>
                    <select value={editForm.role} onChange={e => setEditForm({...editForm, role: e.target.value})}>
                      {roles.map(r => <option key={r} value={r}>{r}</option>)}
                    </select>
                  </td>
                  <td><input type="number" value={editForm.share_capital_ugx} onChange={e => setEditForm({...editForm, share_capital_ugx: e.target.value})} /></td>
                  <td className="mono">{(Number(m.equity_bps) / 100).toFixed(2)}%</td>
                  <td>
                    <select value={editForm.status} onChange={e => setEditForm({...editForm, status: e.target.value})}>
                      {statuses.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </td>
                  <td>
                    <button className="btn gold" onClick={() => saveEdit(m.member_id)}>Save</button>{" "}
                    <button className="btn ghost" onClick={() => setEditingId(null)}>Cancel</button>
                  </td>
                </tr>
              ) : (
                <tr key={m.member_id}>
                  <td>{m.full_name}</td>
                  <td><span className="badge-role">{m.role}</span></td>
                  <td className="amount">{m.share_capital_ugx === null ? "—" : fmtUgx(m.share_capital_ugx)}</td>
                  <td className="mono">{m.equity_bps === null ? "—" : (Number(m.equity_bps) / 100).toFixed(2) + "%"}</td>
                  <td>{m.status}</td>
                  {isOwner && <td><button className="btn ghost" onClick={() => startEdit(m)}>Edit</button> <button className="btn ghost" onClick={() => resetPin(m)}>Reset PIN</button></td>}
                </tr>
              )
            ))}
          </tbody>
        </table>
      </div>
      {lastIssuedPin && (
        <div className="owner-lock">
          PIN for <b>{lastIssuedPin.name}</b>: <span className="mono" style={{fontSize:16}}>{lastIssuedPin.pin}</span> — relay this to them privately (WhatsApp/SMS/in person). It won't be shown again.
        </div>
      )}
      <div className="card">
        <div className="section-title">Add Member</div>
        <OwnerGate ownerPassword={ownerPassword} isOwner={isOwner}>
          <div className="form-grid">
            <div className="field"><label>Full name</label><input value={form.fullName} onChange={e => setForm({...form, fullName: e.target.value})} /></div>
            <div className="field"><label>Role</label>
              <select value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                {roles.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>
            <div className="field"><label>Initial share capital (UGX)</label><input type="number" value={form.shareCapitalUgx} onChange={e => setForm({...form, shareCapitalUgx: e.target.value})} /></div>
            <div className="field"><label>PIN (optional — leave blank to auto-generate)</label><input value={form.pin} onChange={e => setForm({...form, pin: e.target.value})} placeholder="e.g. 4821" /></div>
          </div>
          <button className="btn gold" disabled={!form.fullName} onClick={submit}>Add member</button>
        </OwnerGate>
      </div>
    </div>
  );
}

function Ledger({ data, me, isOwner, ownerPassword, doAction }) {
  const categories = (data.config.LedgerCategories || "").split(",");
  const [form, setForm] = useState({ category: categories[0] || "", amountUgx: "", description: "" });

  const submit = async () => {
    if (!me) return;
    await doAction({ action: "addLedgerEntry", category: form.category, amountUgx: Number(form.amountUgx), description: form.description });
    setForm({ category: categories[0] || "", amountUgx: "", description: "" });
  };

  const verify = (id) => doAction({ action: "verifyTransaction", ownerPassword, ownerName: "Owner", transactionId: id });

  return (
    <div>
      <div className="card">
        <div className="section-title">Add Transaction</div>
        {!me && <p style={{fontSize:12,color:"var(--text-muted)"}}>Select your name at the top right first.</p>}
        <div className="form-grid">
          <div className="field"><label>Category</label>
            <select value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
              {categories.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field"><label>Amount (UGX)</label><input type="number" value={form.amountUgx} onChange={e => setForm({...form, amountUgx: e.target.value})} /></div>
        </div>
        <div className="field"><label>Description</label><input value={form.description} onChange={e => setForm({...form, description: e.target.value})} /></div>
        <button className="btn gold" disabled={!me || !form.amountUgx} onClick={submit}>Record transaction</button>
      </div>
      <div className="card">
        <div className="section-title">All Transactions</div>
        <table>
          <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>By</th><th>Amount</th><th>Status</th>{isOwner && <th></th>}</tr></thead>
          <tbody>
            {(data.ledger || []).slice().reverse().map(l => {
              const member = (data.members || []).find(m => m.member_id === l.recorded_by);
              return (
                <tr key={l.transaction_id}>
                  <td>{new Date(l.timestamp).toLocaleDateString()}</td>
                  <td>{l.category}</td>
                  <td>{l.description}</td>
                  <td>{member ? member.full_name : l.recorded_by}</td>
                  <td className="amount">{fmtUgx(l.amount_ugx)}</td>
                  <td><span className={"stamp " + l.verification_state}>{l.verification_state}</span></td>
                  {isOwner && <td>{l.verification_state === "Pending" && <button className="btn ghost" onClick={() => verify(l.transaction_id)}>Verify</button>}</td>}
                </tr>
              );
            })}
            {(data.ledger || []).length === 0 && <tr><td colSpan="7" className="empty">No transactions yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Batches({ data, me, isOwner, ownerPassword, doAction }) {
  const [form, setForm] = useState({ label: "", initialQuantity: "", purchaseCostUgx: "" });
  const [logForm, setLogForm] = useState({ batchId: "", eventType: "", quantityAffected: "", notes: "" });
  const eventTypes = (data.config.HealthEventTypes || "").split(",");

  const addBatch = async () => {
    await doAction({ action: "addBatch", ownerPassword, ownerName: "Owner", label: form.label, initialQuantity: Number(form.initialQuantity), purchaseCostUgx: Number(form.purchaseCostUgx) });
    setForm({ label: "", initialQuantity: "", purchaseCostUgx: "" });
  };

  const addLog = async () => {
    if (!me || !logForm.batchId) return;
    await doAction({ action: "addHealthLog", batchId: logForm.batchId, eventType: logForm.eventType, quantityAffected: Number(logForm.quantityAffected || 0), notes: logForm.notes });
    setLogForm({ batchId: "", eventType: "", quantityAffected: "", notes: "" });
  };

  return (
    <div>
      <div className="card">
        <div className="section-title">Batches</div>
        <table>
          <thead><tr><th>Batch</th><th>Started</th><th>Initial</th><th>Active now</th><th>Cost</th><th>Est. value</th><th>Status</th></tr></thead>
          <tbody>
            {(data.batches || []).map(b => (
              <tr key={b.batch_id}>
                <td>{b.label}</td>
                <td>{b.start_date}</td>
                <td>{b.initial_quantity}</td>
                <td>{b.current_active_quantity}</td>
                <td className="amount">{fmtUgx(b.purchase_cost_ugx)}</td>
                <td className="amount">{fmtUgx(b.estimated_asset_value_ugx)}</td>
                <td>{b.status}</td>
              </tr>
            ))}
            {(data.batches || []).length === 0 && <tr><td colSpan="7" className="empty">No batches yet.</td></tr>}
          </tbody>
        </table>
      </div>

      <div className="card">
        <div className="section-title">New Batch</div>
        <OwnerGate ownerPassword={ownerPassword} isOwner={isOwner}>
          <div className="form-grid">
            <div className="field"><label>Label (e.g. "June Birds")</label><input value={form.label} onChange={e => setForm({...form, label: e.target.value})} /></div>
            <div className="field"><label>Initial quantity</label><input type="number" value={form.initialQuantity} onChange={e => setForm({...form, initialQuantity: e.target.value})} /></div>
            <div className="field"><label>Purchase cost (UGX)</label><input type="number" value={form.purchaseCostUgx} onChange={e => setForm({...form, purchaseCostUgx: e.target.value})} /></div>
          </div>
          <button className="btn gold" disabled={!form.label} onClick={addBatch}>Create batch</button>
        </OwnerGate>
      </div>

      <div className="card">
        <div className="section-title">Log Health Event</div>
        {!me && <p style={{fontSize:12,color:"var(--text-muted)"}}>Select your name at the top right first.</p>}
        <div className="form-grid">
          <div className="field"><label>Batch</label>
            <select value={logForm.batchId} onChange={e => setLogForm({...logForm, batchId: e.target.value})}>
              <option value="">— choose —</option>
              {(data.batches || []).map(b => <option key={b.batch_id} value={b.batch_id}>{b.label}</option>)}
            </select>
          </div>
          <div className="field"><label>Event type</label>
            <select value={logForm.eventType} onChange={e => setLogForm({...logForm, eventType: e.target.value})}>
              <option value="">— choose —</option>
              {eventTypes.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div className="field"><label>Quantity affected</label><input type="number" value={logForm.quantityAffected} onChange={e => setLogForm({...logForm, quantityAffected: e.target.value})} /></div>
          <div className="field"><label>Notes</label><input value={logForm.notes} onChange={e => setLogForm({...logForm, notes: e.target.value})} /></div>
        </div>
        <button className="btn gold" disabled={!me || !logForm.batchId || !logForm.eventType} onClick={addLog}>Log event</button>
      </div>
    </div>
  );
}

function Reports({ data }) {
  const ledger = data.ledger || [];
  const batches = data.batches || [];
  const healthLog = data.healthLog || [];
  const dailyNotes = data.dailyNotes || [];

  // --- Per-batch ROI ---
  const batchReports = batches.map(b => {
    const batchLedger = ledger.filter(l => l.related_batch_id === b.batch_id);
    const revenue = batchLedger.filter(l => l.category === "Revenue").reduce((s, l) => s + Number(l.amount_ugx || 0), 0);
    const expenditure = batchLedger.filter(l => l.category === "Expenditure" || l.category === "AssetLoss").reduce((s, l) => s + Number(l.amount_ugx || 0), 0);
    const totalCost = Number(b.purchase_cost_ugx || 0) + expenditure;
    const netPosition = revenue + Number(b.estimated_asset_value_ugx || 0) - totalCost;
    const roiPct = totalCost > 0 ? (netPosition / totalCost) * 100 : 0;

    const logs = healthLog.filter(l => l.batch_id === b.batch_id);
    const mortality = logs.filter(l => l.event_type === "Mortality").reduce((s, l) => s + Number(l.quantity_affected || 0), 0);
    const mortalityRate = Number(b.initial_quantity) > 0 ? (mortality / Number(b.initial_quantity)) * 100 : 0;

    const notes = dailyNotes.filter(n => n.batch_id === b.batch_id);
    const totalFeedCost = notes.reduce((s, n) => s + Number(n.feed_cost_ugx || 0), 0);
    const totalEggs = notes.reduce((s, n) => s + Number(n.eggs_produced || 0), 0);
    const feedCostPerBird = Number(b.current_active_quantity) > 0 ? totalFeedCost / Number(b.current_active_quantity) : 0;

    return { ...b, revenue, totalCost, netPosition, roiPct, mortality, mortalityRate, totalFeedCost, totalEggs, feedCostPerBird };
  });

  // --- Monthly P&L trend ---
  const monthly = {};
  ledger.forEach(l => {
    const month = new Date(l.timestamp).toISOString().slice(0, 7); // YYYY-MM
    if (!monthly[month]) monthly[month] = { revenue: 0, expenditure: 0 };
    if (l.category === "Revenue") monthly[month].revenue += Number(l.amount_ugx || 0);
    if (l.category === "Expenditure" || l.category === "AssetLoss") monthly[month].expenditure += Number(l.amount_ugx || 0);
  });
  const months = Object.keys(monthly).sort();

  return (
    <div>
      <div className="card">
        <div className="section-title">Batch Performance</div>
        <p style={{fontSize:12,color:"var(--text-muted)",marginTop:-6,marginBottom:14}}>
          Net position = revenue + current asset value − (purchase cost + recorded expenditure/losses). ROI is net position over total cost.
        </p>
        <table>
          <thead><tr><th>Batch</th><th>Revenue</th><th>Total Cost</th><th>Net</th><th>ROI</th><th>Mortality</th><th>Feed/bird</th><th>Eggs (total)</th></tr></thead>
          <tbody>
            {batchReports.map(b => (
              <tr key={b.batch_id}>
                <td>{b.label}</td>
                <td className="amount">{fmtUgx(b.revenue)}</td>
                <td className="amount">{fmtUgx(b.totalCost)}</td>
                <td className={"amount " + (b.netPosition >= 0 ? "pos" : "neg")}>{fmtUgx(b.netPosition)}</td>
                <td className={"mono " + (b.roiPct >= 0 ? "pos" : "neg")}>{b.roiPct.toFixed(1)}%</td>
                <td className="mono">{b.mortalityRate.toFixed(1)}% ({b.mortality})</td>
                <td className="amount">{fmtUgx(Math.round(b.feedCostPerBird))}</td>
                <td className="mono">{b.totalEggs}</td>
              </tr>
            ))}
            {batchReports.length === 0 && <tr><td colSpan="8" className="empty">No batches yet — reports will populate as you log data.</td></tr>}
          </tbody>
        </table>
      </div>

      <div className="card">
        <div className="section-title">Monthly Cash Flow</div>
        <table>
          <thead><tr><th>Month</th><th>Revenue</th><th>Expenditure &amp; Losses</th><th>Net</th></tr></thead>
          <tbody>
            {months.map(m => {
              const row = monthly[m];
              const net = row.revenue - row.expenditure;
              return (
                <tr key={m}>
                  <td>{m}</td>
                  <td className="amount pos">{fmtUgx(row.revenue)}</td>
                  <td className="amount neg">{fmtUgx(row.expenditure)}</td>
                  <td className={"amount " + (net >= 0 ? "pos" : "neg")}>{fmtUgx(net)}</td>
                </tr>
              );
            })}
            {months.length === 0 && <tr><td colSpan="4" className="empty">No transactions yet.</td></tr>}
          </tbody>
        </table>
        <p style={{fontSize:12,color:"var(--text-muted)",marginTop:10}}>
          This trend gets more useful the longer the group records consistently — a few months of data will start showing seasonality.
        </p>
      </div>
    </div>
  );
}

function Ideas({ data, me, isOwner, ownerPassword, doAction }) {
  const [form, setForm] = useState({ title: "", description: "" });
  const statuses = ["New", "Planned", "Done", "Rejected"];

  const submit = async () => {
    if (!me || !form.title) return;
    await doAction({ action: "addIdea", title: form.title, description: form.description });
    setForm({ title: "", description: "" });
  };

  const setStatus = (ideaId, status) => doAction({ action: "updateIdeaStatus", ownerPassword, ownerName: "Owner", ideaId, status });

  const backlog = (data.backlog || []).slice().reverse();

  return (
    <div>
      <div className="card">
        <div className="section-title">Drop a New Idea</div>
        {!me && <p style={{fontSize:12,color:"var(--text-muted)"}}>Select your name at the top right first.</p>}
        <div className="field"><label>Title</label><input value={form.title} onChange={e => setForm({...form, title: e.target.value})} placeholder="e.g. Add loan tracking module" /></div>
        <div className="field"><label>Description (optional)</label><textarea rows="3" value={form.description} onChange={e => setForm({...form, description: e.target.value})} /></div>
        <button className="btn gold" disabled={!me || !form.title} onClick={submit}>Add to backlog</button>
      </div>

      <div className="card">
        <div className="section-title">Backlog</div>
        <p style={{fontSize:12,color:"var(--text-muted)",marginTop:-6,marginBottom:14}}>
          Ideas land here instantly without touching code. Batch a few related "Planned" items together for the next deploy instead of rebuilding one at a time.
        </p>
        <table>
          <thead><tr><th>Title</th><th>Description</th><th>By</th><th>Status</th>{isOwner && <th>Set status</th>}</tr></thead>
          <tbody>
            {backlog.map(idea => {
              const member = (data.members || []).find(m => m.member_id === idea.submitted_by);
              return (
                <tr key={idea.idea_id}>
                  <td>{idea.title}</td>
                  <td style={{color:"var(--text-muted)"}}>{idea.description}</td>
                  <td>{member ? member.full_name : idea.submitted_by}</td>
                  <td><span className={"stamp " + idea.status}>{idea.status}</span></td>
                  {isOwner && (
                    <td>
                      <select value={idea.status} onChange={e => setStatus(idea.idea_id, e.target.value)}>
                        {statuses.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </td>
                  )}
                </tr>
              );
            })}
            {backlog.length === 0 && <tr><td colSpan={isOwner ? 5 : 4} className="empty">No ideas yet — the next one you think of goes here.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Settings({ data, session, isOwner, ownerPassword, setOwnerPassword, doAction }) {
  const [pwInput, setPwInput] = useState("");
  const [newCatKey, setNewCatKey] = useState("LedgerCategories");
  const [newCatValue, setNewCatValue] = useState(data.config.LedgerCategories || "");
  const [newPassword, setNewPassword] = useState("");
  const [oldPin, setOldPin] = useState("");
  const [newPin, setNewPin] = useState("");

  const unlock = () => setOwnerPassword(pwInput);
  const lock = () => setOwnerPassword("");

  const saveConfig = () => doAction({ action: "updateConfig", ownerPassword, ownerName: "Owner", key: newCatKey, value: newCatValue, reason: "Updated via Settings" });
  const rotatePassword = async () => {
    await doAction({ action: "changeOwnerPassword", ownerPassword, ownerName: "Owner", newPassword });
    setOwnerPassword(newPassword);
    setNewPassword("");
  };
  const changePin = async () => {
    await doAction({ action: "changeMyPin", memberId: session.memberId, oldPin, newPin });
    setOldPin(""); setNewPin("");
  };

  return (
    <div>
      <div className="card">
        <div className="section-title">My PIN</div>
        <div className="form-grid">
          <div className="field"><label>Current PIN</label><input type="password" inputMode="numeric" value={oldPin} onChange={e => setOldPin(e.target.value)} /></div>
          <div className="field"><label>New PIN</label><input type="password" inputMode="numeric" value={newPin} onChange={e => setNewPin(e.target.value)} /></div>
        </div>
        <button className="btn gold" disabled={!oldPin || !newPin} onClick={changePin}>Update my PIN</button>
      </div>
      <div className="card">
        <div className="section-title">Owner Access</div>
        {!isOwner ? (
          <div className="form-grid" style={{alignItems:"end"}}>
            <div className="field"><label>Owner password</label><input type="password" value={pwInput} onChange={e => setPwInput(e.target.value)} /></div>
            <button className="btn gold" onClick={unlock}>Unlock</button>
          </div>
        ) : (
          <div>
            <p style={{fontSize:13}}>Owner mode is unlocked on this device. This controls who can add members, batches, and change configuration — see the design doc's §4 for the full model.</p>
            <button className="btn ghost" onClick={lock}>Lock owner mode</button>
          </div>
        )}
      </div>

      <OwnerGate ownerPassword={ownerPassword} isOwner={isOwner}>
        <div className="card">
          <div className="section-title">Extend the System (Config)</div>
          <p style={{fontSize:12,color:"var(--text-muted)"}}>Edit these comma-separated lists to add new ledger categories or health event types without touching code. The frontend reads these dynamically.</p>
          <div className="form-grid">
            <div className="field"><label>Config key</label>
              <select value={newCatKey} onChange={e => { setNewCatKey(e.target.value); setNewCatValue(data.config[e.target.value] || ""); }}>
                <option value="LedgerCategories">LedgerCategories</option>
                <option value="HealthEventTypes">HealthEventTypes</option>
                <option value="Roles">Roles</option>
              </select>
            </div>
            <div className="field"><label>Value (comma-separated)</label><input value={newCatValue} onChange={e => setNewCatValue(e.target.value)} /></div>
          </div>
          <button className="btn gold" onClick={saveConfig}>Save config</button>
        </div>

        <div className="card">
          <div className="section-title">Rotate Owner Password</div>
          <div className="form-grid">
            <div className="field"><label>New owner password</label><input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} /></div>
            <button className="btn gold" disabled={!newPassword} onClick={rotatePassword}>Update password</button>
          </div>
        </div>
      </OwnerGate>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
